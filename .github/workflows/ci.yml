name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Static analysis gates (Checkstyle + SpotBugs)
        run: mvn --batch-mode -Pquality verify -DskipTests

  build:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build, test and install modules
        run: mvn --batch-mode clean install

      - name: CLI demo (smoke)
        run: java -cp "agentlens-cli/target/classes:agentlens-eval/target/classes:agentlens-adapters/target/classes:agentlens-core/target/classes" com.agentlens.cli.AgentLensApp demo

      - name: CLI run (20 scenarios, pass^k, 5 repeats)
        run: |
          mvn -q -pl agentlens-cli exec:java -Dexec.mainClass=com.agentlens.cli.AgentLensApp \
            -Dexec.args="run --scenarios data/scenarios/ops-scenarios.json --repeats 5" || test $? -eq 1
          mvn -q -pl agentlens-cli exec:java -Dexec.mainClass=com.agentlens.cli.AgentLensApp \
            -Dexec.args="compare --baseline correct --candidate correct --repeats 5"
          mvn -q -pl agentlens-cli exec:java -Dexec.mainClass=com.agentlens.cli.AgentLensApp \
            -Dexec.args="compare --baseline correct --candidate flaky --repeats 5" || test $? -eq 1

      - name: CLI show (SQLite restore by run id)
        run: |
          RUN_ID=$(mvn -q -pl agentlens-cli exec:java -Dexec.mainClass=com.agentlens.cli.AgentLensApp \
            -Dexec.args="show --run list" 2>/dev/null | grep -E '^[0-9a-f-]{36}$' | head -1)
          echo "restoring run: $RUN_ID"
          mvn -q -pl agentlens-cli exec:java -Dexec.mainClass=com.agentlens.cli.AgentLensApp \
            -Dexec.args="show --run $RUN_ID" 2>/dev/null | grep -q "evaluation:"

      - name: CLI report (HTML from SQLite)
        run: |
          mvn -q -pl agentlens-cli exec:java -Dexec.mainClass=com.agentlens.cli.AgentLensApp \
            -Dexec.args="report" 2>/dev/null | grep -q "report written"
          grep -q "AgentLens Evaluation Report" output/report.html
          grep -q "STABLE_" output/report.html

