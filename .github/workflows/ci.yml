name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and run tests
        run: mvn --batch-mode clean verify

      - name: CLI demo (smoke)
        run: java -cp "agentlens-cli/target/classes:agentlens-eval/target/classes:agentlens-adapters/target/classes:agentlens-core/target/classes" com.agentlens.cli.AgentLensApp demo

      - name: CLI run (20 scenarios, pass^k, 5 repeats)
        run: |
          JACKSON=$(find ~/.m2/repository/com/fasterxml -name '*.jar' ! -name '*sources*' ! -name '*javadoc*' | tr '\n' ':')
          java -cp "agentlens-cli/target/classes:agentlens-eval/target/classes:agentlens-adapters/target/classes:agentlens-core/target/classes:$JACKSON" \
            com.agentlens.cli.AgentLensApp run --scenarios data/scenarios/ops-scenarios.json --repeats 5 || test $? -eq 1

      - name: CLI compare (release gate rejects bad candidate)
        run: |
          JACKSON=$(find ~/.m2/repository/com/fasterxml -name '*.jar' ! -name '*sources*' ! -name '*javadoc*' | tr '\n' ':')
          java -cp "agentlens-cli/target/classes:agentlens-eval/target/classes:agentlens-adapters/target/classes:agentlens-core/target/classes:$JACKSON" \
            com.agentlens.cli.AgentLensApp compare --baseline correct --candidate correct --repeats 5
          java -cp "agentlens-cli/target/classes:agentlens-eval/target/classes:agentlens-adapters/target/classes:agentlens-core/target/classes:$JACKSON" \
            com.agentlens.cli.AgentLensApp compare --baseline correct --candidate flaky --repeats 5 || test $? -eq 1
